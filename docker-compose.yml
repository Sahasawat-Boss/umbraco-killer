services:
  db:
    image: postgres:16-alpine
    container_name: umb-killer-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: umbkiller
      POSTGRES_PASSWORD: umbkiller
      POSTGRES_DB: umbkiller
    ports:
      - "5434:5432"
    volumes:
      - umbkiller-data:/var/lib/postgresql/data
volumes:
  umbkiller-data:
